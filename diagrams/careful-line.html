<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Careful Assembly Line</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>The careful assembly line</h1>
    <p class="sub">tetris/tetris-003/.assembly-lines/careful.dot — every doer attempt is validated and retried until the validator is satisfied.</p>

    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="careful-line-title careful-line-desc">
      <title id="careful-line-title">The careful assembly line</title>
      <desc id="careful-line-desc">Flowchart of the careful factory line: a planner hands tasks to a doer, a validator sends rejected work back to the doer and accepted work back to the planner, and the run finishes when the planner reports the plan complete.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="120" y1="160" x2="200" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="360" y1="160" x2="480" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="640" y1="160" x2="760" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="280" y1="192" x2="280" y2="300" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M840,128 V88 Q840,80 832,80 H288 Q280,80 280,88 V128" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M840,192 V252 Q840,260 832,260 H568 Q560,260 560,252 V192" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <rect x="368" y="140" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOT COMPLETE</text>
      <rect x="292" y="236" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="324" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMPLETE</text>
      <rect x="528" y="60" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="69" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SATISFIED</text>
      <rect x="652" y="240" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="700" y="249" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOT SATISFIED</text>

      <rect x="40" y="140" width="80" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="40" y="140" width="80" height="40" rx="20" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="80" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">start</text>

      <rect x="200" y="128" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="128" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">planner</text>
      <text x="280" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reads the plan</text>

      <rect x="480" y="128" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="128" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">doer</text>
      <text x="560" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">does one task</text>

      <rect x="760" y="128" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="128" width="160" height="64" rx="6" fill="#eb6c36" fill-opacity="0.12" stroke="#eb6c36" stroke-width="1"/>
      <text x="840" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">validator</text>
      <text x="840" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">lens: testability</text>

      <rect x="240" y="300" width="80" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="240" y="300" width="80" height="40" rx="20" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="280" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">finish</text>

      <line x1="32" y1="384" x2="968" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="396" width="24" height="16" rx="8" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="152" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">START / FINISH</text>
      <rect x="280" y="396" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">MACHINE (AGENT)</text>
      <line x1="460" y1="404" x2="488" y2="404" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="496" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RETRY LOOP</text>
      <line x1="600" y1="404" x2="628" y2="404" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="636" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ALWAYS ROUTES</text>
      <text x="760" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">LABEL = ROUTES ON RESULT</text>
    </svg>
  </div>
</body>
</html>
